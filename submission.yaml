submission:
  title: "D1 Mission Readiness & Predictive Maintenance Copilot"

  problem_statement: >
    Military organizations cannot reliably determine whether aircraft, vehicles,
    and equipment are mission-ready. Maintenance runs on fixed calendar schedules
    regardless of actual component condition, while HUMS sensor data that could
    predict failures weeks in advance sits unanalyzed. The US military spends $90B/year
    on maintenance, and unexpected platform failures cause weeks of operational downtime.

  solution_summary: >
    We built an enterprise-grade Bob Copilot and modular monolith that ingests HUMS
    sensor telemetry and service records to classify asset readiness (FMC/PMC/NMC),
    predict component Remaining Useful Life (RUL) using GPU-accelerated ML trained on
    NASA C-MAPSS data, explain degradation issues in natural language via watsonx.ai
    Granite 3.0, and recommend prioritized maintenance plans optimized against mission deadlines.

  key_features:
    - "GPU-accelerated XGBoost RUL prognostics trained on NASA C-MAPSS turbofan data (18.21 cycles RMSE)"
    - "Condition-based FMC/PMC/NMC fleet readiness scoring and automated failure window conflict alerts"
    - "IBM Bob Copilot integration via FastMCP exposing 8 operational tools and resource streams"
    - "IBM watsonx.ai Granite 3-8B natural language readiness explanations and commander briefings"
    - "Mission-window-aware maintenance optimizer scheduling work orders by mission criticality and technician availability"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Tailwind CSS", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite 3-8B", "FastMCP"]
    databases: ["PostgreSQL", "SQLite", "SQLAlchemy 2.0 Async"]
    other: ["Docker", "Docker Compose", "XGBoost", "Scikit-Learn", "GitHub Actions"]

  what_we_are_most_proud_of: >
    Our end-to-end integration between genuine aerospace sensor telemetry (NASA C-MAPSS),
    GPU-accelerated RUL forecasting, and IBM Bob's Model Context Protocol (MCP). The Copilot
    is load-bearing: an operator can talk to Bob in plain English, and Bob autonomously queries
    telemetry, runs RUL models, explains root causes via watsonx.ai Granite, and prioritizes
    work orders to ensure zero mission aborts.

  known_limitations: >
    Telemetry streaming is currently simulated from real NASA C-MAPSS turbofan run-to-failure cycles
    rather than live hardware MIL-STD-1553 avionics bus feeds. The watsonx.ai service includes an
    intelligent dual-mode engine so evaluators without active IBM Cloud keys can experience full
    functionality without errors.

