submission:
  title: "Mission Readiness and Predictive Maintenance Copilot"  # REQUIRED

  problem_statement: >                           # REQUIRED
    Military organisations cannot reliably determine whether aircraft, vehicles,
    and equipment are mission-ready. Maintenance runs on fixed calendar schedules
    instead of actual condition. HUMS sensor data that could predict failures
    weeks in advance goes unanalysed.

  solution_summary: >                            # REQUIRED
    An AI-driven copilot that ingests HUMS sensor telemetry and service records,
    computes per-asset readiness scores using a trained RandomForest failure-risk
    model, predicts component failures within a 30-day window, and generates a
    prioritised maintenance plan with explainable risk drivers.

  key_features:                                  # REQUIRED
    - "Synthetic HUMS dataset generator with realistic sensor distributions and injected failure patterns"
    - "Explainable RandomForest failure-risk model with per-asset feature importance breakdowns"
    - "Interactive Streamlit dashboard with readiness scores, failure predictions, and maintenance plans"
    - "Risk-score based failure injection using multi-sensor gradient thresholds"
    - "End-to-end pipeline from raw sensor data to actionable maintenance decisions in under 300 lines"

  tech_stack:
    languages: ["Python 3.11"]                   # REQUIRED
    frameworks: ["Streamlit", "scikit-learn"]
    ibm_technologies: ["IBM Bob (Antigravity)"]
    databases: []
    other: ["pandas", "numpy", "matplotlib", "joblib"]

  what_we_are_most_proud_of: >
    The end-to-end pipeline from raw sensor data to an actionable, explained
    maintenance plan delivered in under 300 total lines of Python. Every prediction
    comes with a human-readable explanation of which sensor readings drove the risk
    score, making the system trustworthy for a logistics planner who needs to justify
    maintenance decisions.

  known_limitations: >
    The dataset is synthetic; real HUMS data would require domain-specific calibration
    of thresholds and sensor ranges. The model is a single RandomForest classifier;
    a production system would benefit from time-series models and ensemble approaches.
    No authentication or role-based access control on the dashboard. Not deployed to
    a live URL for this submission round.

