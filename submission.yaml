submission:
  title: "D1 Mission Readiness and Predictive Maintenance Copilot"

  problem_statement: >
    Military organizations cannot reliably determine whether aircraft, vehicles,
    and equipment are mission-ready. Maintenance runs on fixed calendar schedules
    regardless of actual component condition, while HUMS sensor data that could
    predict failures weeks in advance sits unanalyzed. The US military spends $90B/year
    on maintenance, and unexpected platform failures cause weeks of operational downtime.

  solution_summary: >
    We built an industry-grade, defense-ready Bob Copilot and modular monolith that ingests HUMS
    sensor telemetry and service records to classify asset readiness (FMC/PMC/NMC),
    predict component Remaining Useful Life (RUL) using GPU-accelerated ML trained on
    NASA C-MAPSS data, simulate counterfactual environmental mission stress (desert heat, sandstorm ingestion, 9G combat turns),
    dynamically match degraded platforms to secondary Air Tasking Order (ATO) sortie profiles to prevent lost combat tempo,
    and auto-generate official digital AFTO Form 781A discrepancy work orders with Red X grounding symbols and DLA NSN parts requisitions
    via IBM Bob FastMCP and watsonx.ai Granite 3.0.

  key_features:
    - "Counterfactual Mission Stress and Environmental Twin: Simulates thermodynamic HPC/LPT thermal creep, sand/dust particulate ingestion, and 9G combat air maneuvering to calculate accelerated wear factors and mission survivability probability before takeoff."
    - "Mission-Adaptive Sortie Re-allocation Matrix: Dynamic Air Tasking Order (ATO) matching engine that re-allocates degraded platforms (PMC) to viable low-stress sorties (Recon ISR / Ferry) instead of binary grounding, preserving combat generation tempo."
    - "Automated Digital AFTO Form 781A and DA Form 2404 Generator: Defense-compliant digital discrepancy dispatching with official Red X / Red Diagonal symbols, automated Job Control Numbers (JCN), military J-codes, and DLA National Stock Number (NSN) parts requisitions."
    - "GPU-Accelerated XGBoost RUL Prognostics on NASA C-MAPSS: 108 condition telemetry features with rolling exponential statistics predicting remaining useful life at 18.21 cycles holdout RMSE."
    - "IBM Bob FastMCP Operational Copilot: Model Context Protocol exposing 11 autonomous tools and live resource streams connecting IBM Bob directly into the military fleet maintenance workflow."
    - "Dual-Engine watsonx.ai Granite 3-8B Synthesis: Natural-language root cause explanation, thermodynamic telemetry anomaly interpretation, and commander morning readiness briefings."

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Tailwind CSS", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite 3-8B", "FastMCP"]
    databases: ["PostgreSQL", "SQLite", "SQLAlchemy 2.0 Async"]
    other: ["Docker", "Docker Compose", "XGBoost", "Scikit-Learn", "GitHub Actions"]

  what_we_are_most_proud_of: >
    Moving military aviation beyond static calendar maintenance and toy dashboards into an autonomous,
    mission-adaptive combat generation system. Rather than just showing charts, our copilot acts as a
    tactical flight officer: it runs physics-informed counterfactual mission stress simulations (desert heat,
    sandstorms, 9G turns), dynamically re-assigns degraded platforms to compatible secondary sorties to prevent lost missions,
    and auto-dispatches official Air Force AFTO Form 781A discrepancy orders with Red X grounding symbols and NSN parts requisition codes
    via IBM Bob and watsonx.ai Granite.

  known_limitations: >
    Telemetry streaming is currently simulated from real NASA C-MAPSS turbofan run-to-failure cycles
    rather than live hardware MIL-STD-1553 avionics bus feeds. The watsonx.ai service includes an
    intelligent dual-mode engine so evaluators without active IBM Cloud keys can experience full
    functionality without errors.

